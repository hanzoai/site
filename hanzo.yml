# Read by hanzoai/ci's build.yml (.github/workflows/cicd.yml). hanzo.ai is a static
# export with no pod: universe infra/sites/sites.yaml serves it from the Sites
# plane prefix hanzo/hanzoai-site. The test builds out/ (prebuild reads the live
# figures and plan prices from api.hanzo.ai and stops on any failure), and a push
# to main publishes that out/ with the agent files (Markdown twins, llms.txt,
# robots.txt, sitemap.xml, the API catalog) written beside it.
test:
  - name: test
    run: |
      set -e
      corepack enable
      pnpm install --frozen-lockfile
      pnpm test
      pnpm build

site:
  slug: hanzoai-site
  dir: out
  on: [main]
  agent: hanzo.ai

# The tenant whose deploy key publishes, which makes the prefix hanzo/hanzoai-site.
kms:
  org: hanzo
